<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dashboard Keuangan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="toolbar">
        <h1>Dashboard Keuangan</h1>
        <button id="theme-toggle" type="button" aria-pressed="false">
          Mode gelap
        </button>
      </div>
      <form id="f">
        <select name="jenis" aria-label="Jenis">
          <option value="in">Pemasukan</option>
          <option value="out">Pengeluaran</option>
        </select>
        <input
          name="nominal"
          type="number"
          min="1"
          placeholder="Nominal (Rp)"
          required
        />
        <input name="tgl" type="date" required />
        <input name="ket" placeholder="Keterangan" required />
        <button id="submit-entry" type="submit">Tambah catatan</button>
        <button id="cancel-edit" class="secondary-button" type="button" hidden>
          Batal
        </button>
      </form>
      <div class="grid">
        <section class="card balance">
          <div class="head">
            <h2>Saldo</h2>
            <span class="total" id="saldo"></span>
          </div>
        </section>
        <section class="card in">
          <div class="head">
            <h2>Pemasukan</h2>
            <span class="total" id="tin"></span>
          </div>
          <ul id="lin"></ul>
        </section>
        <section class="card out">
          <div class="head">
            <h2>Pengeluaran</h2>
            <span class="total" id="tout"></span>
          </div>
          <ul id="lout"></ul>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
